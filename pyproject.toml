[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[project]
name = "selectivbench"
version = "0.1.0"
description = "Evaluating Selectivity in Sequence Models"
readme = "README.md"
authors = [
    {name = "Younes Bouhadjar", email = "y.bouhadjar@fz-juelich.de"},
    {name = "Maxime Fabre", email = "m.fabre@fz-juelich.de"}
]
requires-python = ">=3.11.6,<3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "more-itertools>=10.5.0",
    "pathos>=0.3.3",
    "torch>=2.4.1",
    "pandas>=2.2.3",
    "torchaudio>=2.4.1",
    "tqdm>=4.66.5",
    "nltk>=3.9.1",
    "h5py>=3.12.1",
    "matplotlib>=3.8.1",
    "pyyaml>=6.0",
    "scikit-learn>=1.6.1",
    "wandb>=0.19.2",
    "einops>=0.8.0",
    "mamba-ssm>=2.2.4",
    "causal-conv1d>=1.4.0",
    "flash-linear-attention>=0.3.0",
    "seaborn>=0.13.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.urls]
"Homepage" = "https://github.com/symseqbench/selectivbench"
"Bug Tracker" = "https://github.com/symseqbench/selectivbench/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
